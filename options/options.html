<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>need_more_jlu - 高级自定义与偏好设置</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="options-wrapper">
    <div class="options-header">
      <div class="logo-box">JLU</div>
      <div>
        <h1>设置</h1>
        <p>管理吉大官方 OA 增强工具箱与扩展偏好</p>
      </div>
    </div>

    <!-- Study Dashboard Navigation Card -->
    <div class="settings-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">空教室查询页面</h2>
        <a href="../dashboard/index.html" target="_blank" class="btn btn-primary" style="white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px;">
          <span>打开自习仪表盘</span>
          <span>↗</span>
        </a>
      </div>
    </div>

    <!-- OA Toolbox Settings -->
    <div class="settings-card">
      <h2>吉大OA增强设置</h2>
      <div class="form-group">
        <label class="checkbox-label" style="font-weight: 600;">
          <input type="checkbox" id="oa-tools-enabled" checked />
          <span>启用 吉大OA增强</span>
        </label>
        <span class="help-text">官方原貌抽屉秒开浏览与最近访问历史记录</span>
      </div>

      <div id="oa-sub-options"
        style="margin-left: 24px; padding-left: 12px; border-left: 2px solid #e2e8f0; margin-top: 12px; display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="checkbox-label">
            <input type="checkbox" id="drawer-preview-enabled" checked />
            <span>启用官方原貌侧边浏览</span>
          </label>
          <span class="help-text">点击公文时在右侧弹出保真抽屉（按住 Ctrl/Cmd 点击仍可打开新标签页）</span>
        </div>
      </div>
    </div>

    <!-- Data Management Card -->
    <div class="settings-card">
      <h2>💾 本地数据与统计</h2>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
        <button type="button" class="btn btn-secondary" id="btn-clear-history">🗑️ 清空公文阅读历史与统计</button>
      </div>
      <span class="help-text" style="margin-top: 8px;">清空右下角悬浮框中记录的最近一周公文查阅历史及累计阅读报告总数。</span>
    </div>
    </div>

    <!-- Dynamic Top Toast Notification -->
    <div id="toast-notification" class="toast-notification">
      <span class="toast-dot"></span>
      <span class="toast-message" id="toast-message">设置已保存</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>

</html>
