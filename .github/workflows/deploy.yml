name: Deploy to Microsoft Edge Add-ons

on:
  workflow_dispatch:
    inputs:
      upload_only:
        description: '仅上传到草稿箱（不立即提交正式送审）'
        required: true
        type: boolean
        default: false
      notes:
        description: '提交给微软审核员的附言 (Notes for certification)'
        required: false
        type: string
        default: 'Routine optimization, security hardening, and performance improvements.'
      create_release:
        description: '同步创建 GitHub Release 并在 Releases 中挂载 ZIP 安装包'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build, Package & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json
        id: validate
        run: |
          if [ ! -f "manifest.json" ]; then
            echo "::error::manifest.json not found!"
            exit 1
          fi
          # Check JSON syntax and MV3 specification with Node
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (data.manifest_version !== 3) throw new Error('manifest_version must be 3');
          if (!data.version) throw new Error('version field missing');
          if (!data.name) throw new Error('name field missing');
          console.log('Valid manifest.json:', data.name, 'v' + data.version);
          "

      - name: Package extension
        id: package
        shell: pwsh
        run: |
          ./scripts/package.ps1

      - name: Inspect Package Artifacts
        run: |
          echo "Package created: ${{ steps.package.outputs.zip_name }}"
          echo "Version: ${{ steps.package.outputs.version }}"
          echo "SHA256: ${{ steps.package.outputs.sha256 }}"
          ls -lh ${{ steps.package.outputs.zip_path }}*

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: need_more_jlu-v${{ steps.package.outputs.version }}-dist
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Microsoft Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: ${{ steps.package.outputs.zip_path }}
          upload-only: ${{ inputs.upload_only }}
          notes-for-certification: ${{ inputs.notes }}
