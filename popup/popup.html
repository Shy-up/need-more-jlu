<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>need_more_jlu 控制面板</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo">JLU</div>
        <div>
          <div class="title">need_more_jlu</div>
          <div class="subtitle">吉大校园网增强</div>
        </div>
      </div>
      <a href="../options/options.html" target="_blank" class="settings-icon" title="更多高级设置">⚙️</a>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="stat-unread">0</div>
        <div class="stat-label">未读通知</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="stat-starred">0</div>
        <div class="stat-label">星标收藏</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">当前页条目</div>
      </div>
    </div>

    <!-- Theme Switcher -->
    <div class="section-title">🎨 主题与风格预设</div>
    <div class="theme-grid">
      <button class="theme-btn active" data-theme="light">
        <span class="theme-icon">☀️</span>
        <span>现代浅色</span>
      </button>
      <button class="theme-btn" data-theme="dark">
        <span class="theme-icon">🌙</span>
        <span>暗夜极客</span>
      </button>
      <button class="theme-btn" data-theme="sepia">
        <span class="theme-icon">📜</span>
        <span>护眼纸墨</span>
      </button>
      <button class="theme-btn" data-theme="navy">
        <span class="theme-icon">🎓</span>
        <span>经典吉大蓝</span>
      </button>
      <button class="theme-btn" data-theme="custom">
        <span class="theme-icon">🖼️</span>
        <span>自定义壁纸</span>
      </button>
    </div>

    <!-- Quick Actions -->
    <div class="section-title" style="margin-top: 14px;">⚡ 快捷操作</div>
    <div class="actions-row">
      <button class="btn btn-secondary" id="btn-mark-read">✓ 本页全部标为已读</button>
      <button class="btn btn-primary" id="btn-open-oa">🚀 打开吉大 OA</button>
    </div>

    <!-- Starred Notices -->
    <div class="section-title" style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
      <span>⭐ 我的收藏 (<span id="starred-header-count">0</span>)</span>
      <span style="font-size: 11px; color: #94a3b8;">最近收藏</span>
    </div>
    <div class="starred-list" id="starred-list">
      <div class="empty-tip">暂无收藏的通知，点击列表右侧星标收藏</div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>need_more_jlu v1.0.0</span>
      <a href="../options/options.html" target="_blank">自定义壁纸与高级设置 →</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
