<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>need_more_jlu</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-title">need_more_jlu</span>
      </div>
      <a href="../options/options.html" target="_blank" class="settings-link" title="扩展设置">⚙️ 设置</a>
    </header>

    <!-- Main Navigation Actions -->
    <div class="actions-group">
      <!-- 1. Classroom Study Dashboard -->
      <button class="action-card action-primary" id="btn-open-dashboard" title="打开自习空教室仪表盘">
        <div class="action-main">
          <div class="action-title-row">
            <span class="action-title">自习空教室仪表盘</span>
            <span class="action-arrow">↗</span>
          </div>
          <div class="action-desc">全天节次排课 · 楼层舱位选座 · 实时空闲状态</div>
        </div>
      </button>

      <!-- 2. Official OA Portal -->
      <button class="action-card action-secondary" id="btn-open-oa" title="打开吉大官方 OA (WebVPN)">
        <div class="action-main">
          <div class="action-title-row">
            <span class="action-title">吉大官方 OA</span>
            <span class="action-arrow">↗</span>
          </div>
          <div class="action-desc">WebVPN 免密直达 · 原文保真侧边抽屉</div>
        </div>
      </button>
    </div>

    <!-- Campus & Status Footer -->
    <footer class="popup-footer">
      <div class="campus-indicator">
        <span class="campus-label">当前校区</span>
        <span class="campus-name" id="popupCampusName">南岭校区 (工科)</span>
      </div>
      <span class="version-label">v2.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
