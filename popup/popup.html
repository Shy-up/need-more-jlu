<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>need_more_jlu</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-title">need_more_jlu</span>
      </div>
      <a href="../options/options.html" target="_blank" class="settings-link" title="扩展设置">⚙️ 设置</a>
    </header>

    <!-- Main Navigation Actions -->
    <div class="actions-group">
      <!-- 1. Classroom Study Dashboard -->
      <button class="action-card action-primary" id="btn-open-dashboard" title="打开自习空教室仪表盘">
        <div class="action-main">
          <div class="action-title-row">
            <span class="action-title">自习空教室速查</span>
            <span class="action-arrow">↗</span>
          </div>
          <div class="action-desc">成功逃离官方神秘查询机制</div>
        </div>
      </button>

      <!-- 2. Intranet Portals (OA / WebVPN / EMAP Home) -->
      <div class="action-row-grid">
        <!-- 2.1 Official OA -->
        <button class="action-mini-card" id="btn-open-oa" title="打开吉大官方 OA (自动感知直连/VPN)">
          <div class="action-mini-icon">📑</div>
          <div class="action-mini-title">官方 OA</div>
          <div class="action-mini-desc">公文通知</div>
        </button>

        <!-- 2.2 WebVPN Portal -->
        <button class="action-mini-card" id="btn-open-vpn" title="打开吉大校外 WebVPN 门户 (vpn.jlu.edu.cn)">
          <div class="action-mini-icon">🌐</div>
          <div class="action-mini-title">WebVPN</div>
          <div class="action-mini-desc">校外网关</div>
        </button>

        <!-- 2.3 EMAP Home Portal -->
        <button class="action-mini-card" id="btn-open-emap" title="打开吉大教务微服务办事大厅 (自动感知直连/VPN)">
          <div class="action-mini-icon">🎓</div>
          <div class="action-mini-title">教务大厅</div>
          <div class="action-mini-desc">微服务门户</div>
        </button>

        <!-- 2.4 Library Portal -->
        <button class="action-mini-card" id="btn-open-lib" title="打开吉林大学图书馆 (lib.jlu.edu.cn)">
          <div class="action-mini-icon">📚</div>
          <div class="action-mini-title">校图书馆</div>
          <div class="action-mini-desc">馆藏资源</div>
        </button>
      </div>

      <!-- 3. Campus Sites Expandable Directory -->
      <div class="portal-accordion" id="portalAccordion">
        <div class="accordion-header" id="btnToggleAccordion" title="点击展开/收起常用校内网站导航">
          <div class="accordion-title-box">
            <span class="accordion-icon">🧭</span>
            <span class="accordion-title">其它常用校内站点</span>
            <span class="portal-count-badge" id="portalCountBadge">22</span>
          </div>
          <span class="accordion-arrow" id="accordionArrow">▾</span>
        </div>

        <div class="accordion-body" id="accordionBody">
          <div class="search-box-wrapper">
            <input type="text" id="portalSearchInput" class="portal-search-input" placeholder="搜索网站名称或功能..."
              autocomplete="off" />
          </div>
          <div class="portal-list-scroll" id="portalList">
            <!-- 动态渲染网站卡片 -->
          </div>
          <div class="easter-egg-container" id="easterEggWrapper" title="点击体验百度吉大">
            <span class="easter-egg-text" id="easterEggText">话说，直接百度会不会更快...?</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Campus & Status Footer -->
    <footer class="popup-footer">
      <div class="campus-indicator">
        <span class="campus-label">当前校区</span>
        <span class="campus-name" id="popupCampusName">南岭校区</span>
      </div>
      <span class="version-label" id="popupVersionLabel">v1.0.1</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
